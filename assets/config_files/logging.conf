[loggers]
keys=root,netmiko,netmiko_base,netmiko_transport,paramiko,paramiko_transport

[logger_netmiko]
level=INFO
handlers=consoleHandler,fileHandler
qualname=netmiko
propagate=0

[logger_netmiko_base]
level=INFO
handlers=fileHandler
qualname=netmiko.base_connection
propagate=0

[logger_netmiko_transport]
level=INFO
handlers=fileHandler
qualname=netmiko.transport
propagate=0

[logger_paramiko]
level=WARNING
handlers=fileHandler
qualname=paramiko
propagate=0

[logger_paramiko_transport]
level=WARNING
handlers=fileHandler
qualname=paramiko.transport
propagate=0

[logger_root]
level=DEBUG
handlers=consoleHandler, fileHandler

[formatters]
keys=mainFormatter

[formatter_mainFormatter]
format=%(asctime)s - %(levelname)-8s %(message)s

[handlers]
keys=consoleHandler, fileHandler

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=mainFormatter
args=(sys.stdout, )

# Rotating so that logs/debug.log cannot grow without bound. The log holds
# discovered topology detail, so it is treated as sensitive: keep it small
# and capped rather than accumulating every run forever.
[handler_fileHandler]
class=handlers.RotatingFileHandler
level=DEBUG
formatter=mainFormatter
args=("logs/debug.log", "a", 5242880, 3, "utf-8")
